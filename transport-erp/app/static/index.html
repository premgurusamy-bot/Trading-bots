<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Transport ERP">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>Transport ERP</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--ink:#1c2333;--muted:#667085;--line:#e3e7ee;--brand:#0f3d6e;--brand-ink:#fff;--accent:#f28c28;--ok:#12825a;--bad:#c53030;--chip:#eef2f8;--safe-b:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f141c;--panel:#171e29;--ink:#e6eaf2;--muted:#9aa4b5;--line:#273142;--brand:#5aa2ff;--brand-ink:#08121f;--chip:#1f2836}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:flex;min-height:100vh}
nav.side{width:224px;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
nav.side h1{font-size:16px;margin:4px 8px 14px;color:var(--brand)}
.grp{font-size:11px;text-transform:uppercase;color:var(--muted);margin:14px 8px 4px;letter-spacing:.05em}
nav.side a,.more a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:9px;color:var(--ink);text-decoration:none;cursor:pointer}
nav.side a.on,nav.side a:hover{background:var(--chip)}
.n{background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;line-height:18px}
main{flex:1;padding:20px;min-width:0;padding-bottom:calc(90px + var(--safe-b))}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header.top h2{margin:0;font-size:20px;flex:1}
h3{margin:18px 0 8px;font-size:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px}
.card .v{font-size:21px;font-weight:650}.card .l{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600;background:var(--chip)}
td.long{max-width:360px;white-space:pre-wrap;word-break:break-word}.wrap{overflow-x:auto}
.rec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.rec .t{font-weight:600;display:flex;gap:8px;align-items:center;justify-content:space-between}
.rec dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0;font-size:13px}.rec dt{color:var(--muted)}.rec dd{margin:0;word-break:break-word}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 13px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;min-height:38px}
button.p,.btn.p{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.bad{color:var(--bad)}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:100%;min-height:40px}
textarea{min-height:90px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--chip);white-space:nowrap}
.pill.critical,.pill.error,.pill.failed,.pill.overdue,.pill.rejected{background:#fde2e2;color:#9b1c1c}.pill.warning,.pill.pending_approval,.pill.pending{background:#fdf0d5;color:#8a5a00}
.pill.ok,.pill.paid,.pill.delivered,.pill.done,.pill.sent,.pill.published,.pill.approved,.pill.available{background:#d9f3e6;color:#0b6b46}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.agent{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}.small{font-size:12px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}.modal .box{background:var(--panel);border-radius:18px 18px 0 0;padding:18px;width:min(640px,100%);max-height:92vh;overflow:auto;padding-bottom:calc(18px + var(--safe-b))}
@media(min-width:761px){.modal{align-items:flex-start;padding:30px 12px}.modal .box{border-radius:16px}}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}.form .full{grid-column:1/-1}
.thumb{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line)}
iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.tabs{display:none}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:85%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{position:sticky;bottom:calc(66px + var(--safe-b));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.composer textarea{min-height:44px;height:44px;resize:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.chips button{white-space:nowrap;font-size:13px;min-height:32px;padding:4px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--safe-b));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;max-width:90vw}
@media(max-width:760px){
 nav.side{display:none} main{padding:14px 12px calc(90px + var(--safe-b))}
 .grid2,.form{grid-template-columns:1fr}
 .cards{grid-template-columns:1fr 1fr}
 .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:10;padding-bottom:var(--safe-b)}
 .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 7px;font-size:11px;color:var(--muted);text-decoration:none;position:relative;cursor:pointer}
 .tabs a.on{color:var(--brand);font-weight:600}.tabs a .i{font-size:20px;line-height:22px}
 .tabs a .n{position:absolute;top:3px;right:calc(50% - 22px)}
}
</style>
</head>
<body>
<div class="app">
<nav class="side" id="side"></nav>
<main><header class="top"><h2 id="title"></h2><span id="aiflag" class="pill"></span></header><div id="view"></div></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="mbox"></div></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IN_APP=/TransportERPApp/.test(navigator.userAgent);
let META=null,cache={},counts={},page=location.hash.slice(1)||'dashboard';
async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt,body:opt.body?JSON.stringify(opt.body):undefined});
 if(r.status===401){loginView();throw new Error('login')}
 if(!r.ok){let t=await r.text();try{t=JSON.parse(t).detail||t}catch(e){}toast('⚠ '+t);throw new Error(t)} return r.json()}
const money=v=>'₹ '+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const PAGES=[
 ['Overview',[['dashboard','Home','🏠'],['chat','Ask AI','💬'],['ai','AI Team','🤖'],['approvals','Approvals','✅'],['tasks','Tasks','📋'],['alerts','Alerts','🔔'],['reports','Reports','📊']]],
 ['Operations',[['trips','Trips','🚚'],['vehicles','Fleet','🚛'],['employees','Staff & Drivers','👷'],['customers','Customers','🏢']]],
 ['Finance',[['invoices','Invoices','🧾'],['expenses','Expenses','⛽']]],
 ['Growth',[['leads','Leads','🎯'],['content','Content & Social','📣'],['designs','Designs & Canva','🎨'],['website','Website','🌐']]],
 ['System',[['settings','Settings','⚙️'],['runs','AI activity log','🕘']]]];
const ALL=Object.fromEntries(PAGES.flatMap(([,i])=>i).map(([k,l,ic])=>[k,{l,ic}]));
const TABS=['dashboard','chat','approvals','trips','more'];
function drawNav(){
 side.innerHTML='<h1>🚚 Transport ERP</h1>'+PAGES.map(([g,items])=>`<div class=grp>${g}</div>`+items.map(([k,l,ic])=>`<a class="${k===page?'on':''}" onclick="go('${k}')"><span>${ic} ${l}</span>${counts[k]?`<span class=n>${counts[k]}</span>`:''}</a>`).join('')).join('');
 const moreOn=!['dashboard','chat','approvals','trips'].includes(page);
 tabs.innerHTML=TABS.map(k=>k==='more'?`<a class="${moreOn?'on':''}" onclick="showMore()"><span class=i>☰</span>More${(counts.alerts||0)+(counts.tasks||0)?`<span class=n>${(counts.alerts||0)+(counts.tasks||0)}</span>`:''}</a>`:`<a class="${k===page?'on':''}" onclick="go('${k}')"><span class=i>${ALL[k].ic}</span>${ALL[k].l}${counts[k]?`<span class=n>${counts[k]}</span>`:''}</a>`).join('')}
function showMore(){mbox.innerHTML='<div class=more>'+PAGES.map(([g,items])=>`<div class=grp>${g}</div>`+items.filter(([k])=>!TABS.includes(k)).map(([k,l,ic])=>`<a onclick="closeModal();go('${k}')"><span>${ic} ${l}</span>${counts[k]?`<span class=n>${counts[k]}</span>`:''}</a>`).join('')).join('')+(IN_APP?`<div class=grp>App</div><a onclick="location.href='http://localhost/?change=1'">🔌 Change server address</a>`:'')+'</div>';modal.classList.add('on')}
function go(p){page=p;if(location.hash.slice(1)!==p)history.pushState(null,'','#'+p);render()}
window.onpopstate=()=>{page=location.hash.slice(1)||'dashboard';closeModal();render()};
async function boot(){META=await api('/api/meta');const p=META.providers;
 aiflag.textContent=p.claude&&p.openai?'AI: Claude + ChatGPT':p.claude?'AI: Claude':p.openai?'AI: ChatGPT':'AI off · rules mode';aiflag.className='pill '+(META.ai_enabled?'ok':'warning');
 window._agents=await api('/api/agents');render();
 setInterval(()=>{if(['dashboard','ai','approvals','runs'].includes(page)&&!modal.classList.contains('on'))render(true)},20000)}
function loginView(){title.textContent='Login';tabs.innerHTML='';side.innerHTML='';view.innerHTML=`<div class=card style="max-width:380px"><p>Enter the ERP password.</p><input id=pw type=password placeholder=Password onkeydown="if(event.key==='Enter')doLogin()"><br><br><button class=p onclick="doLogin()">Login</button></div>`}
async function doLogin(){await api('/api/login',{method:'POST',body:{password:pw.value}});boot()}
async function refreshCounts(){const k=(await api('/api/dashboard')).kpis;counts={approvals:k.pending_approvals,alerts:k.open_alerts,tasks:k.open_tasks,leads:k.new_leads,trips:k.trips_pending};drawNav();return k}
async function refs(){await Promise.all(['customers','vehicles','employees','trips','designs'].map(async t=>cache[t]=await api('/api/t/'+t)))}
function refLabel(t,id){const r=(cache[t]||[]).find(x=>x.id==id);if(!r)return id??'';return r.name||r.reg_no||(r.origin?`#${r.id} ${r.origin}→${r.destination}`:'#'+r.id)}
async function render(quiet){title.textContent=(ALL[page]||{l:META.tables[page]?.label||''}).l;const k=await refreshCounts();if(!quiet&&page!=='chat')view.innerHTML='<p class=muted>Loading…</p>';await (VIEWS[page]||(()=>tableView(page)))(k)}
const small=()=>innerWidth<=760;
const agentName=k=>(window._agents||[]).find(a=>a.key===k)?.name||String(k).replace(/_/g,' ');
const fmtMin=m=>m>=1440?(m/1440)+' day(s)':m>=60?(m/60)+' h':m+' min';
const provLabel=p=>({auto:'Auto',claude:'Claude',openai:'ChatGPT'})[p||'auto'];
const VIEWS={
 async dashboard(k){const d=await api('/api/dashboard');
  const c=[['Revenue (month)',money(k.revenue_this_month)],['Profit (month)',money(k.revenue_this_month-k.expenses_this_month)],['Receivables',money(k.receivables_outstanding)],['Overdue',money(k.overdue_amount)],['Trips pending',k.trips_pending],['Trips active',k.trips_active],['Vehicles free',`${k.vehicles_available} / ${k.vehicles_total}`],['New leads',k.new_leads]];
  view.innerHTML=`<div class=bar><button class=p onclick="editRow('trips')">＋ New trip</button><button onclick="editRow('expenses',0,{date:new Date().toISOString().slice(0,10),category:'fuel'})">⛽ Add expense</button><button onclick="go('chat')">💬 Ask AI</button><button onclick="runAll()">▶ Run AI team</button></div>
  <div class=cards>${c.map(([l,v])=>`<div class=card><div class=l>${l}</div><div class=v>${v}</div></div>`).join('')}</div>
  <div class=grid2><div><h3>Alerts</h3>${d.alerts.length?d.alerts.map(a=>`<div class=rec style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1"><span class="pill ${a.level}">${a.level}</span> <b>${esc(a.category)}</b> ${esc(a.message)}</div><button onclick="resolveAlert(${a.id})">✓</button></div>`).join(''):'<p class=muted>No open alerts 🎉</p>'}</div>
  <div><h3>What the AI team did</h3>${d.runs.slice(0,8).map(r=>`<div class=rec><b>${esc(agentName(r.agent_key))}</b> <span class="pill ${r.status}">${r.status==='running'?'running…':esc(r.mode||'')}</span> <span class="muted small">${esc(r.started_at)}</span><div class="small" style="white-space:pre-wrap;margin-top:4px">${esc((r.summary||'').slice(0,300))}</div></div>`).join('')||'<p class=muted>No runs yet.</p>'}</div></div>`},
 async chat(){const st=window._chat||(window._chat={role:'general_manager',provider:'auto',msgs:[]});
  if(!META.ai_enabled){view.innerHTML=`<div class=card>Ask AI needs a Claude or ChatGPT API key. Add <code>ANTHROPIC_API_KEY</code> or <code>OPENAI_API_KEY</code> to the <code>.env</code> file on the server and restart.</div>`;return}
  const roles=window._agents.map(a=>`<option value="${a.key}" ${a.key===st.role?'selected':''}>${esc(a.name)}</option>`).join('');
  const provs=['auto',...['claude','openai'].filter(p=>META.providers[p])].map(p=>`<option value="${p}" ${p===st.provider?'selected':''}>${provLabel(p)}</option>`).join('');
  const sugg=['How is business this month?','Which invoices are overdue? Send reminders.','Plan this week\'s social posts','Which trips need a vehicle?','Write a LinkedIn post about our Chennai–Bengaluru service'];
  view.innerHTML=`<div class=bar><select style="flex:2;min-width:180px" onchange="_chat.role=this.value;_chat.msgs=[];render()">${roles}</select><select style="flex:1;min-width:110px" onchange="_chat.provider=this.value">${provs}</select></div>
  <div class=chat id=chatlog>${st.msgs.length?st.msgs.map(m=>`<div class="msg ${m.role}">${esc(m.content)}${m.actions&&m.actions.length?`<div class="small muted" style="margin-top:6px">✔ ${m.actions.length} action(s): ${esc(m.actions.map(a=>a.split(':')[0]).join(', '))}${m.via?' · via '+esc(m.via):''}</div>`:m.via?`<div class="small muted" style="margin-top:4px">via ${esc(m.via)}</div>`:''}</div>`).join(''):`<p class=muted>Talk to your ${esc(agentName(st.role))}. It reads live ERP data and can act: create tasks, draft messages and posts, assign trips and more.</p><div class=chips>${sugg.map(s=>`<button onclick="sendChat(${esc(JSON.stringify(s))})">${esc(s)}</button>`).join('')}</div>`}</div>
  <div class=composer><textarea id=chatin placeholder="Message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea><button class=p id=chatbtn onclick="sendChat()">Send</button></div>`;scrollTo(0,document.body.scrollHeight)},
 async ai(){const a=await api('/api/agents');window._agents=a;
  view.innerHTML=`<div class=bar><button class=p onclick="runAll()">▶ Run whole team now</button><span class="muted small">Each role runs by itself on its schedule. Rules run even without a key; with Claude or ChatGPT the role reasons and acts.</span></div>
  <div class=agents>${a.map(x=>`<div class=agent><div><b>${esc(x.name)}</b> <span class="pill ${x.enabled?'ok':''}">${x.enabled?'auto':'paused'}</span> <span class=pill>${provLabel(x.provider)}</span> ${x.open_tasks?`<span class="pill warning">${x.open_tasks} tasks</span>`:''}</div>
   <div class="small muted">${esc(x.mission)}</div><div class=small>Every <b>${fmtMin(x.interval_min)}</b> · last ${esc(x.last_run||'never')}</div>
   ${x.last?`<div class=small style="white-space:pre-wrap;border-left:3px solid var(--line);padding-left:8px">${esc((x.last.summary||'').slice(0,240))}</div>`:''}
   <div class=bar style="margin:0"><button class=p onclick="runAgent('${x.key}')">Run now</button><button onclick="editAgent('${x.key}')">Settings</button><button onclick="_chat=null;window._chat={role:'${x.key}',provider:'auto',msgs:[]};go('chat')">💬 Chat</button></div></div>`).join('')}</div>`},
 async approvals(){const [o,c]=await Promise.all([api('/api/t/outbox?status=pending_approval'),api('/api/t/content?status=pending_approval')]);await refs();
  view.innerHTML=`<p class="muted small">Messages and posts wait here unless you turn on auto-send / auto-publish in Settings.</p>
  <h3>Posts to publish (${c.length})</h3>${c.map(x=>`<div class=rec>${x.design_id?designImg(x.design_id,'max-height:260px'):''}<div class=t><span>${esc(x.title)}</span><span class=pill>${esc(x.platform)}</span></div><div class="muted small">by ${esc(agentName(x.created_by))} · for ${esc(x.scheduled_for||'now')}</div><div style="white-space:pre-wrap;margin:6px 0">${esc(x.body)}</div><div class="muted small">${esc(x.hashtags||'')}</div>
   <div class=bar style="margin:8px 0 0"><button class=ok onclick="act('/api/content/${x.id}/approve')">✓ Approve</button><button onclick="editRow('content',${x.id})">Edit</button><button class=bad onclick="act('/api/content/${x.id}/reject')">Reject</button></div></div>`).join('')||'<p class=muted>Nothing waiting.</p>'}
  <h3>Messages to send (${o.length})</h3>${o.map(x=>`<div class=rec><div class=t><span>${esc(x.subject||'(no subject)')}</span><span class=pill>${esc(x.channel)}</span></div><div class="muted small">to ${esc(x.recipient)} · by ${esc(agentName(x.created_by))}</div><div style="white-space:pre-wrap;margin:6px 0">${esc(x.body)}</div>
   <div class=bar style="margin:8px 0 0"><button class=ok onclick="act('/api/outbox/${x.id}/approve')">✓ Approve & send</button><button onclick="editRow('outbox',${x.id})">Edit</button><button class=bad onclick="act('/api/outbox/${x.id}/reject')">Reject</button></div></div>`).join('')||'<p class=muted>Nothing waiting.</p>'}
  ${META.webhook?'':'<p class="small muted">No delivery webhook yet: approved items stay in the Outbox for you to send yourself. See Settings.</p>'}`},
 async designs(){const d=await api('/api/t/designs');cache.designs=d;const cv=META.canva;
  view.innerHTML=`<div class=bar>${META.providers.openai?`<button class=p onclick="genImage()">✨ Create image with ChatGPT</button>`:''}<button onclick="runAgent('designer')">🤖 Ask AI Designer</button>${cv.connected?`<button onclick="canvaPick()">⬇ Import from Canva</button>`:`<button onclick="go('settings')">Connect Canva</button>`}</div>
  <div class=agents>${d.map(x=>`<div class=agent>${designImg(x.id)}<b>${esc(x.name)}</b><span class="small muted">${esc(x.kind||'')} · ${esc(agentName(x.created_by))}${x.canva_design_id?' · in Canva':''}</span>
   <div class=bar style="margin:0">${cv.connected?(x.canva_edit_url?`<a class="btn p" href="${esc(x.canva_edit_url)}" target=_blank>Edit in Canva ↗</a><button onclick="canvaBack(${x.id})">⬇ Bring back</button>`:`<button class=p onclick="toCanva(${x.id})">Edit in Canva</button>`):''}<a class=btn href="/api/designs/${x.id}.${x.image_path?'png':'svg'}" download="design-${x.id}.${x.image_path?'png':'svg'}">Download</a><button class=bad onclick="delRow('designs',${x.id})">✕</button></div></div>`).join('')||'<p class=muted>No designs yet.</p>'}</div>`},
 async website(){view.innerHTML=`<div class=bar><a class=btn href="/site" target=_blank>Open website ↗</a><button class=p onclick="runAgent('website_designer')">Ask AI to improve it</button><button onclick="go('website_sections')">Edit sections</button></div><iframe src="/site"></iframe>`},
 async settings(){const c=await api('/api/company');const f=['name','tagline','phone','email','address','city','services','about','gst_rate','service_interval_km'];const cv=META.canva,p=META.providers;
  view.innerHTML=`<h3>Connections</h3><div class=rec><dl>
   <dt>Claude</dt><dd>${p.claude?'✅ '+esc(META.models.claude):'Not set. Add ANTHROPIC_API_KEY to .env'}</dd>
   <dt>ChatGPT</dt><dd>${p.openai?'✅ '+esc(META.models.openai)+' · images: '+esc(META.models.openai_image):'Not set. Add OPENAI_API_KEY to .env'}</dd>
   <dt>Canva</dt><dd>${!cv.configured?'Not set. Add CANVA_CLIENT_ID and CANVA_CLIENT_SECRET to .env, with redirect URL <code>'+esc(cv.redirect_uri)+'</code>':cv.connected?'✅ Connected <button onclick="canvaOff()">Disconnect</button>':`<a class="btn p" href="/api/canva/connect">Connect Canva</a> <span class="small muted">Do this once from the PC's browser.</span>`}</dd>
   <dt>Delivery</dt><dd>${META.webhook?'✅ Webhook connected':'Not set (OUTBOX_WEBHOOK_URL for Zapier/Make/n8n)'}</dd>
   <dt>Password</dt><dd>${META.password?'✅ On':'Off. Set ERP_PASSWORD in .env'}</dd></dl></div>
  <h3>Company & automation</h3><div class=card><div class=form>${f.map(k=>`<label class="${['about','services'].includes(k)?'full':''}">${k.replace(/_/g,' ')}${k==='about'?`<textarea id="c_${k}">${esc(c[k])}</textarea>`:`<input id="c_${k}" value="${esc(c[k])}">`}</label>`).join('')}
   <label class=full style="flex-direction:row;gap:8px;color:var(--ink)"><input type=checkbox id=c_auto_publish style="width:auto;min-height:0" ${c.auto_publish?'checked':''}> Fully automatic social media (publish AI posts without my approval)</label>
   <label class=full style="flex-direction:row;gap:8px;color:var(--ink)"><input type=checkbox id=c_auto_send_messages style="width:auto;min-height:0" ${c.auto_send_messages?'checked':''}> Fully automatic messages (send AI emails / WhatsApp / SMS without my approval)</label></div><br><button class=p onclick="saveCompany()">Save</button></div>
  ${IN_APP?`<p><button onclick="location.href='http://localhost/?change=1'">🔌 Change server address</button></p>`:`<p class="small muted">📱 On a phone: install the Android app, or use your browser's "Add to Home screen".</p>`}`},
 async runs(){const f=window._runFilter;window._runFilter=null;const r=await api('/api/runs'+(f?'?agent='+f:''));
  view.innerHTML=r.map(x=>`<div class=rec><div class=t><span>${esc(agentName(x.agent_key))}</span><span class="pill ${x.status}">${esc(x.mode||'')} ${esc(x.status)}</span></div><div class="small muted">${esc(x.started_at)} · tokens ${x.tokens_in||0}/${x.tokens_out||0}</div><div class=small style="white-space:pre-wrap;margin-top:4px">${esc(x.summary)}</div>${JSON.parse(x.actions||'[]').length?`<details class=small><summary>${JSON.parse(x.actions).length} actions</summary><pre style="white-space:pre-wrap">${esc(JSON.parse(x.actions).join('\n'))}</pre></details>`:''}</div>`).join('')||'<p class=muted>No runs yet.</p>'},
};
function designImg(id,style=''){const d=(cache.designs||[]).find(x=>x.id==id)||{};const src=d.image_path?`/api/designs/${id}.png?v=${encodeURIComponent(d.updated_at||'')}`:`/api/designs/${id}.svg`;return`<img class=thumb style="${style}" loading=lazy src="${src}" alt="">`}
async function tableView(t){if(!META.tables[t]){view.innerHTML='Unknown page';return}await refs();const spec=META.tables[t],rows=await api('/api/t/'+t),cols=Object.keys(spec.cols).filter(c=>!['svg','html','dedupe_key','image_path'].includes(c));window._rows=rows;
 const head=`<div class=bar><button class=p onclick="editRow('${t}')">＋ Add</button><input placeholder="Search…" style="flex:1;max-width:280px" oninput="filterRows(this.value)"><span class="muted small">${rows.length}</span></div>`;
 if(small()){const main=cols[0];view.innerHTML=head+`<div id=tbl>${rows.map(r=>`<div class=rec data-row><div class=t><span>${esc(t==='trips'?`${r.origin} → ${r.destination}`:fmt(spec.cols[main],r[main],main))}</span>${r.status?`<span class="pill ${esc(r.status)}">${esc(r.status)}</span>`:''}</div><dl>${cols.filter(c=>c!==main&&c!=='status'&&!(t==='trips'&&['origin','destination'].includes(c))&&r[c]!=null&&r[c]!=='').slice(0,7).map(c=>`<dt>${c.replace(/_id$/,'').replace(/_/g,' ')}</dt><dd>${esc(fmt(spec.cols[c],r[c],c).slice(0,200))}</dd>`).join('')}</dl><div class=bar style="margin:0">${rowActions(t,r)}<button onclick="editRow('${t}',${r.id})">Edit</button><button class=bad onclick="delRow('${t}',${r.id})">✕</button></div></div>`).join('')}</div>`}
 else view.innerHTML=head+`<div class=wrap><table id=tbl><tr><th>#</th>${cols.map(c=>`<th>${c.replace(/_id$/,'').replace(/_/g,' ')}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr data-row><td>${r.id}</td>${cols.map(c=>`<td class="${spec.cols[c].type==='longtext'?'long':''}">${spec.cols[c].type==='select'&&r[c]?`<span class="pill ${esc(r[c])}">${esc(r[c])}</span>`:esc(fmt(spec.cols[c],r[c],c).slice(0,300))}</td>`).join('')}<td style="white-space:nowrap">${rowActions(t,r)}<button onclick="editRow('${t}',${r.id})">Edit</button> <button class=bad onclick="delRow('${t}',${r.id})">✕</button></td></tr>`).join('')}</table></div>`}
function fmt(s,v,c){if(v==null)return'';if(s.type.startsWith('ref:'))return String(refLabel(s.type.slice(4),v));if(['amount','total','freight_amount','tax','monthly_salary'].includes(c))return money(v);return String(v)}
function rowActions(t,r){if(t==='trips'){const n={assigned:'in_transit',in_transit:'delivered'}[r.status];return n?`<button class=ok onclick="setField('trips',${r.id},{status:'${n}'})">${n==='delivered'?'✓ Delivered':'▶ Start trip'}</button>`:''}
 if(t==='invoices'&&!['paid','cancelled'].includes(r.status))return`<button class=ok onclick="setField('invoices',${r.id},{status:'paid',paid_date:new Date().toISOString().slice(0,10)})">✓ Paid</button>`;
 if(t==='alerts'&&!r.resolved)return`<button onclick="resolveAlert(${r.id})">✓ Resolve</button>`;if(t==='tasks'&&!['done','cancelled'].includes(r.status))return`<button class=ok onclick="setField('tasks',${r.id},{status:'done'})">✓ Done</button>`;
 if(t==='leads'&&r.phone)return`<a class=btn href="tel:${esc(r.phone)}">📞 Call</a>`;if(t==='customers'&&r.phone)return`<a class=btn href="tel:${esc(r.phone)}">📞</a>`;if(t==='employees'&&r.phone)return`<a class=btn href="tel:${esc(r.phone)}">📞</a>`;return''}
function filterRows(q){q=q.toLowerCase();document.querySelectorAll('#tbl [data-row]').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'':'none')}
async function editRow(t,id,defaults={}){await refs();const spec=META.tables[t],r=id?(await api('/api/t/'+t)).find(x=>x.id===id):defaults;
 mbox.innerHTML=`<h3 style="margin-top:0">${id?'Edit':'Add'} – ${esc(spec.label)}</h3><div class=form>${Object.entries(spec.cols).filter(([c])=>!['image_path','svg','dedupe_key'].includes(c)).map(([c,s])=>`<label class="${s.type==='longtext'?'full':''}">${c.replace(/_id$/,'').replace(/_/g,' ')}${input(c,s,r[c])}</label>`).join('')}</div><br><div class=bar><button class=p onclick="saveRow('${t}',${id||0})">Save</button><button onclick="closeModal()">Cancel</button></div>`;modal.classList.add('on')}
function input(c,s,v){v=v??'';if(s.type==='select')return`<select id="f_${c}"><option value=""></option>${s.options.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
 if(s.type.startsWith('ref:')){const t=s.type.slice(4);return`<select id="f_${c}"><option value=""></option>${(cache[t]||[]).map(o=>`<option value="${o.id}" ${o.id==v?'selected':''}>${esc(refLabel(t,o.id))}</option>`).join('')}</select>`}
 if(s.type==='longtext')return`<textarea id="f_${c}">${esc(v)}</textarea>`;const ty={int:'number',real:'number',date:'date'}[s.type]||(c==='phone'?'tel':c==='email'?'email':'text');return`<input id="f_${c}" type="${ty}" ${ty==='number'?'inputmode=decimal step=any':''} value="${esc(v)}">`}
async function saveRow(t,id){const d={};for(const c of Object.keys(META.tables[t].cols)){const el=document.getElementById('f_'+c);if(el)d[c]=el.value}await api(`/api/t/${t}${id?'/'+id:''}`,{method:id?'PUT':'POST',body:d});closeModal();toast('Saved');render()}
async function setField(t,id,d){await api(`/api/t/${t}/${id}`,{method:'PUT',body:d});render(true)}
async function delRow(t,id){if(confirm('Delete this record?')){await api(`/api/t/${t}/${id}`,{method:'DELETE'});render()}}
const resolveAlert=id=>setField('alerts',id,{resolved:1});
async function act(p){await api(p,{method:'POST'});toast('Done');render(true)}
function closeModal(){modal.classList.remove('on')}
async function runAgent(k){await api(`/api/agents/${k}/run`,{method:'POST'});toast('Started '+agentName(k));setTimeout(()=>render(true),3000)}
async function runAll(){await api('/api/agents/run-all',{method:'POST'});toast('AI team started');setTimeout(()=>render(true),3000)}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),3500)}
function editAgent(k){const a=window._agents.find(x=>x.key===k);const provs=['auto','claude','openai'].map(p=>`<option value="${p}" ${p===(a.provider||'auto')?'selected':''}>${provLabel(p)}${p!=='auto'&&!META.providers[p]?' (no key)':''}</option>`).join('');
 mbox.innerHTML=`<h3 style="margin-top:0">${esc(a.name)}</h3><div class=form><label class=full>Mission (what this AI role should do)<textarea id=a_m>${esc(a.mission)}</textarea></label><label>AI engine<select id=a_p>${provs}</select></label><label>Run every (minutes)<input id=a_i type=number value="${a.interval_min}"></label><label>Automatic<select id=a_e><option value=1 ${a.enabled?'selected':''}>on</option><option value=0 ${a.enabled?'':'selected'}>paused</option></select></label></div><br>
 <div class=bar><button class=p onclick="api('/api/agents/${k}',{method:'PUT',body:{mission:a_m.value,interval_min:+a_i.value,enabled:+a_e.value,provider:a_p.value}}).then(()=>{closeModal();render()})">Save</button><button onclick="closeModal()">Cancel</button></div>`;modal.classList.add('on')}
async function saveCompany(){const d={};for(const k of ['name','tagline','phone','email','address','city','services','about','gst_rate','service_interval_km'])d[k]=document.getElementById('c_'+k).value;d.auto_publish=c_auto_publish.checked?1:0;d.auto_send_messages=c_auto_send_messages.checked?1:0;await api('/api/company',{method:'PUT',body:d});toast('Saved')}
async function sendChat(text){const st=window._chat,inp=document.getElementById('chatin');text=(text??inp.value).trim();if(!text)return;st.msgs.push({role:'user',content:text});await VIEWS.chat();
 const btn=document.getElementById('chatbtn');btn.disabled=true;btn.textContent='…';chatlog.insertAdjacentHTML('beforeend','<div class="msg assistant muted" id=typing>Thinking and checking the ERP…</div>');scrollTo(0,document.body.scrollHeight);
 try{const r=await api('/api/chat',{method:'POST',body:{role:st.role,provider:st.provider,messages:st.msgs.map(m=>({role:m.role,content:m.content}))}});st.msgs.push({role:'assistant',content:r.reply||'(done)',actions:r.actions,via:r.provider==='openai'?'ChatGPT':'Claude'})}
 catch(e){st.msgs.pop()} await VIEWS.chat();refreshCounts()}
async function genImage(){mbox.innerHTML=`<h3 style="margin-top:0">✨ Create image with ChatGPT</h3><textarea id=g_p placeholder="e.g. Our blue truck on a highway at sunrise, text: 'On-time delivery across South India'"></textarea><br><br><div class=bar><button class=p id=g_b onclick="doGen()">Create</button><button onclick="closeModal()">Cancel</button></div>`;modal.classList.add('on')}
async function doGen(){g_b.disabled=true;g_b.textContent='Creating… (up to a minute)';try{await api('/api/designs/generate',{method:'POST',body:{prompt:g_p.value}});closeModal();render()}catch(e){g_b.disabled=false;g_b.textContent='Create'}}
async function svgToPng(id){const img=new Image();img.src=`/api/designs/${id}.svg`;await img.decode();const w=img.naturalWidth||1080,h=img.naturalHeight||1080,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);return c.toDataURL('image/png')}
async function toCanva(id){const d=(cache.designs||[]).find(x=>x.id===id);toast('Sending to Canva…');if(!d.image_path)await api(`/api/designs/${id}/png`,{method:'POST',body:{data_url:await svgToPng(id)}});const r=await api(`/api/designs/${id}/canva`,{method:'POST'});toast('Ready in Canva');render(true);if(r.canva_edit_url)window.open(r.canva_edit_url,'_blank')}
async function canvaBack(id){toast('Getting the latest version from Canva…');await api('/api/canva/import',{method:'POST',body:{design_id:id}});toast('Updated from Canva');render(true)}
async function canvaPick(){const list=await api('/api/canva/designs');mbox.innerHTML=`<h3 style="margin-top:0">Import from Canva</h3><div class=agents>${list.map(d=>`<div class=agent>${d.thumbnail?`<img class=thumb src="${esc(d.thumbnail)}">`:''}<b>${esc(d.title||'Untitled')}</b><button class=p onclick="canvaImport('${esc(d.id)}',${esc(JSON.stringify(d.title||'From Canva'))})">Import</button></div>`).join('')||'<p class=muted>No designs found.</p>'}</div><br><button onclick="closeModal()">Close</button>`;modal.classList.add('on')}
async function canvaImport(cid,t){toast('Importing…');await api('/api/canva/import',{method:'POST',body:{canva_design_id:cid,title:t}});closeModal();render()}
async function canvaOff(){await api('/api/canva/disconnect',{method:'POST'});META=await api('/api/meta');render()}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
boot().catch(()=>{});
</script>
</body>
