name: Transport ERP Android APK

# Builds the Transport ERP Android app (Capacitor shell that connects to your ERP server)
# and uploads the APK as a downloadable artifact. Nothing is published to an app store. No secrets are used.
on:
  push:
    paths:
      - "transport-erp/mobile/**"
      - ".github/workflows/transport-erp-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: transport-erp/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: transport-erp/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use preinstalled Android SDK and accept licences
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Install Capacitor
        run: npm ci --no-audit --no-fund
      - name: Copy app files into Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: transport-erp/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "TransportERP-1.0.${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TransportERP-android-apk
          path: transport-erp/mobile/TransportERP-*.apk
          retention-days: 30
          if-no-files-found: error
