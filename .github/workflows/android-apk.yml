name: Android APK

# Builds the Options Desk Android app (Capacitor wrapper of the dashboard) and uploads the APK
# as a downloadable artifact. Nothing is published to an app store. No secrets are used.
on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build dashboard
        run: npm run build
      - name: Copy web build into Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "OptionsDesk-1.0.${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: OptionsDesk-android-apk
          path: frontend/OptionsDesk-*.apk
          retention-days: 30
          if-no-files-found: error
